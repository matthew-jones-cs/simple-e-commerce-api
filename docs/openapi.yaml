          type: string
          readOnly: true
          example: "2026-03-04T20:30:00Z"
    OrderWithItems: # this has a single item
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        order_id:
          type: integer
          readOnly: true
        item_id:
          type: integer
          readOnly: true
        buyer_id:
          type: integer
          readOnly: true
