      type: object
      properties:
        itemIds:
          type: array
        quantites:
          type: array
      example:
        itemIds: [1, 2]
        quantites: [3, 2]
    Review:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
          example: 1
        author_id:
          type: integer
          readOnly: true
          example: 1
        item_id:
          type: integer
          readOnly: true
          example: 1
        title:
          type: string
          example: "This is the title of a review"
        content:
          type: string
          example: "This is the content of a review"
        rating:
          type: integer
          example: "Five"
        createdAt:
          type: string
          readOnly: true
          example: "2026-03-04T20:30:00Z"
    ReviewBody:
      type: object
      properties:
        itemId:
          type: integer
          example: 1
        title:
          type: string
          example: "This is the title of a review"
        content:
          type: string
          example: "This is the content of a review"
        rating:
          type: integer
          example: "Five"
    Reviews:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        author_id:
          type: integer
          readOnly: true
        item_id:
          type: integer
          readOnly: true
        title:
          type: string
        content:
          type: string
        rating:
          type: integer
        createdAt:
          type: string
          readOnly: true
      example:
        - id: 1
          author_id: 1
          item_id: 1
          title: "This is the title of review 1"
          content: "This is the content of a review"
          rating: 5
          created_at: "2026-03-04T20:30:00Z"
        - id: 2
          author_id: 2
          item_id: 1
          title: "This is the title of review 2"
          content: "This is the content of a review"
          rating: 5
