          buyer_id: 1
          created_at: "2026-03-04T20:30:00Z"
        - id: 3
          buyer_id: 2
          created_at: "2026-03-04T20:30:00Z"
    OrderWithItem: # this has a single item
      type: object
      properties:
        id:
          type: integer
          readOnly: true
          example: 1
