          readOnly: true
      example:
        - id: 1
          name: "Bob"
          email: "Bob@example.com"
          role: "USER"
          address: "123 Yard Lane"
          createdAt: "2026-03-04T20:30:00Z"
        - id: 2
          name: "Steve"
          email: "Steve@example.com"
          role: "USER"
          address: "127 Paper Lane"
          createdAt: "2026-03-04T20:30:00Z"
        - id: 3
          name: "Jimmy L"
          email: "Jimmy@example.com"
          role: "SELLER"
          address: "92 Park Lane"
          createdAt: "2026-03-04T20:30:00Z"     
    Item:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
          example: 1
        seller_id:
          type: integer
          readOnly: true
          example: 1
        name:
          type: string
          example: "Stick"
        price:
          type: number
          format: double
          example: 10.99
        amount:
          type: integer
          example: 50
        description:
          type: string
          example: "This is a stick being sold for $10.99. A good deal right?"
        createdAt:
          type: string
          readOnly: true
          example: "2026-03-04T20:30:00Z"
    Items:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        seller_id:
          type: integer
          readOnly: true
        name:
          type: string
        price:
          type: number
          format: double
        amount:
          type: integer
        description:
          type: string
        createdAt:
          type: string
          readOnly: true
      example:
        - id: 1
          seller_id: 1
          name: "Stick"
          price: 10.99
          amount: 50
          description: "This is a stick being sold for $10.99. A good deal right?"
          createdAt: "2026-03-04T20:30:00Z"
        - id: 2
          seller_id: 1
          name: "Big Stick"
          price: 17.99
          amount: 25
          description: "This is a BIG stick being sold for $17.99. Thats a steal!"
          createdAt: "2026-03-04T20:30:00Z"
        - id: 3
          seller_id: 2
          name: "Ball"
          price: 2.73
          amount: 1000
          description: "WHo wants a ball?"
          createdAt: "2026-03-04T20:30:00Z"
    Order:        ########################### I might need to red o this one 
      type: object
      properties:
        id:
          type: integer
          readOnly: true
          example: 1
        buyer_id:
          type: integer
          readOnly: true
          example: 1
        createdAt:
          type: string
          readOnly: true
          example: "2026-03-04T20:30:00Z"
    Orders:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        buyer_id:
          type: integer
          readOnly: true
        createdAt:
          type: string
          readOnly: true
      example:
        - id: 1
          buyer_id: 1
          created_at: "2026-03-04T20:30:00Z"
